<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FinTrack</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>FinTrack: учёт расходов</h1>

  <section>
    <h2>Новый расход</h2>
    <input id="amount" type="number" step="0.01" placeholder="Сумма">
    <input id="category" placeholder="Категория">
    <input id="date" type="date">
    <input id="comment" placeholder="Комментарий">
    <button id="addBtn">Добавить</button>
    <div id="error" class="err"></div>
  </section>

  <section>
    <h2>Расходы</h2>
    <input id="filter" placeholder="Фильтр по категории">
    <button id="filterBtn">Найти</button>
    <button id="resetBtn">Сбросить</button>
    <table>
      <thead><tr><th>№</th><th>Дата</th><th>Категория</th><th>Сумма</th><th>Комментарий</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>

  <section>
    <h2>Лимит на категорию</h2>
    <input id="limitCat" placeholder="Категория">
    <input id="limitVal" type="number" step="0.01" placeholder="Лимит в месяц">
    <button id="limitBtn">Установить</button>
  </section>

  <section>
    <h2>Отчёт за месяц</h2>
    <div id="report"></div>
  </section>
</main>

<script src="expenses.js"></script>
<script src="report.js"></script>
<script src="app.js"></script>
</body>
</html>
